[project]
name = "remo32-espsim"
version = "0.1.0"
description = "Программный симулятор ESP32-контроллера Remo32 (не production-прошивка!)"
requires-python = ">=3.12"
dependencies = [
    "remo32-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiomqtt>=2.3",
    "pydantic-settings>=2.6",
]

[project.scripts]
remo32-espsim = "remo32_espsim.__main__:main"

[tool.uv.sources]
remo32-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remo32_espsim"]
