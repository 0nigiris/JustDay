[project]
name = "remo32-core"
version = "0.1.0"
description = "Общие модели, протокол и утилиты Remo32"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "structlog>=24.4", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remo32_core"]
