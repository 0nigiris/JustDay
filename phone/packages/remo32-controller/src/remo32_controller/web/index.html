<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JustDay</title>
<link rel="manifest" href="/static/manifest.webmanifest?v=__ASSET_VERSION__">
<link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
<link rel="icon" href="/static/icon.svg?v=__ASSET_VERSION__">
<link rel="apple-touch-icon" href="/static/icon.svg?v=__ASSET_VERSION__">
</head>
<body>

<!-- Экран входа -->
<div class="login" id="login" hidden>
  <div class="login-box">
    <img class="login-mark" src="/static/mark.svg?v=__ASSET_VERSION__" alt="" width="140" height="56">
    <h1>JustDay</h1>
    <p>Ваш компьютер под рукой</p>

    <button class="btn primary" id="passkey-btn" hidden><i class="i" style="--src:url(/static/icons/key-round.svg)" aria-hidden="true"></i> Войти по passkey</button>
    <div class="divider" id="login-divider" hidden>или</div>

    <form id="password-form">
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Войти</button>
    </form>

    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- Приложение -->
<div id="main" hidden>
  <!-- Верх экрана как в iOS: полоса с действиями, под ней крупный заголовок.
       При прокрутке крупный уезжает, а его место в полосе занимает маленький —
       поэтому заголовок здесь дважды, и оба ведёт один и тот же код. -->
  <header class="top" id="top">
    <div class="bar-row">
      <button class="icon-btn" id="btn-pc" title="Сменить компьютер" hidden></button>
      <div class="title-sm" id="page-title-sm" aria-hidden="true">Пульт</div>
      <button class="icon-btn" id="btn-refresh" title="Обновить" aria-label="Обновить"><i class="i" style="--src:url(/static/icons/refresh-cw.svg)" aria-hidden="true"></i></button>
    </div>
    <div class="top-text">
      <h1 id="page-title">Пульт</h1>
      <div class="sub" id="conn-status">подключение…</div>
    </div>
  </header>

  <main id="view"><div class="empty">Загрузка…</div></main>

  <!-- Ссылки, а не кнопки: так работает системная кнопка «назад». -->
  <nav class="tabbar" id="tabbar">
    <a class="tab" href="#/deck" data-tab="deck"><span class="ico"><i class="i" style="--src:url(/static/icons/layout-grid.svg)" aria-hidden="true"></i></span><span>Пульт</span></a>
    <a class="tab" href="#/jarvis" data-tab="jarvis"><span class="ico"><i class="i" style="--src:url(/static/icons/panel-top.svg)" aria-hidden="true"></i></span><span>JustDay</span></a>
    <a class="tab" href="#/pcs" data-tab="pcs"><span class="ico"><i class="i" style="--src:url(/static/icons/monitor.svg)" aria-hidden="true"></i></span><span>ПК</span></a>
    <a class="tab" href="#/schedule" data-tab="schedule"><span class="ico"><i class="i" style="--src:url(/static/icons/timer.svg)" aria-hidden="true"></i></span><span>Расписание</span></a>
    <a class="tab" href="#/more" data-tab="more"><span class="ico"><i class="i" style="--src:url(/static/icons/settings.svg)" aria-hidden="true"></i></span><span>Ещё</span></a>
  </nav>
</div>

<!-- Подтверждение. Своё, а не confirm(): системное окно на телефоне
     появляется у верхнего края, не даёт назвать кнопки своими словами
     и не показывает, что именно случится. -->
<div id="sheet" hidden>
  <div class="sheet-back" data-sheet="no"></div>
  <div class="sheet-card">
    <div class="sheet-icon" id="sheet-icon"></div>
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-text" id="sheet-text"></div>
    <div class="sheet-buttons">
      <button class="btn" data-sheet="no">Отмена</button>
      <button class="btn danger" id="sheet-yes" data-sheet="yes">Да</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script src="/static/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
