<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Remo32</title>
<link rel="manifest" href="/static/manifest.webmanifest?v=__ASSET_VERSION__">
<link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
<link rel="icon" href="/static/icon.svg?v=__ASSET_VERSION__">
<link rel="apple-touch-icon" href="/static/icon.svg?v=__ASSET_VERSION__">
</head>
<body>

<!-- Экран входа -->
<div class="login" id="login" hidden>
  <div class="login-box">
    <div class="login-mark">🎛</div>
    <h1>Remo32</h1>
    <p>Управление домашними ПК</p>

    <button class="btn primary" id="passkey-btn" hidden>🔑 Войти по passkey</button>
    <div class="divider" id="login-divider" hidden>или</div>

    <form id="password-form">
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Войти</button>
    </form>

    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- Приложение -->
<div id="main" hidden>
  <header class="top" id="top">
    <div class="top-text">
      <h1 id="page-title">Пульт</h1>
      <div class="sub" id="conn-status">подключение…</div>
    </div>
    <button class="icon-btn" id="btn-pc" title="Сменить компьютер" hidden></button>
    <button class="icon-btn" id="btn-refresh" title="Обновить">↻</button>
  </header>

  <main id="view"><div class="empty">Загрузка…</div></main>

  <!-- Ссылки, а не кнопки: так работает системная кнопка «назад». -->
  <nav class="tabbar" id="tabbar">
    <a class="tab" href="#/deck" data-tab="deck"><span class="ico">🎛</span><span>Пульт</span></a>
    <a class="tab" href="#/jarvis" data-tab="jarvis"><span class="ico">◑</span><span>JustDay</span></a>
    <a class="tab" href="#/pcs" data-tab="pcs"><span class="ico">🖥</span><span>ПК</span></a>
    <a class="tab" href="#/schedule" data-tab="schedule"><span class="ico">⏰</span><span>Расписание</span></a>
    <a class="tab" href="#/more" data-tab="more"><span class="ico">⋯</span><span>Ещё</span></a>
  </nav>
</div>

<!-- Подтверждение. Своё, а не confirm(): системное окно на телефоне
     появляется у верхнего края, не даёт назвать кнопки своими словами
     и не показывает, что именно случится. -->
<div id="sheet" hidden>
  <div class="sheet-back" data-sheet="no"></div>
  <div class="sheet-card">
    <div class="sheet-icon" id="sheet-icon">⚠️</div>
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-text" id="sheet-text"></div>
    <div class="sheet-buttons">
      <button class="btn" data-sheet="no">Отмена</button>
      <button class="btn danger" id="sheet-yes" data-sheet="yes">Да</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script src="/static/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
