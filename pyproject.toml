[project]
name = "justday"
version = "0.1.0"
description = "JustDay — voice front-end that turns Claude Code into a personal desktop agent for KDE Plasma"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "claude-agent-sdk>=0.2.150",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "openwakeword>=0.6.0",
    "torch>=2.8",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
justday = "justday.cli:main"
jarvis = "justday.cli:main"  # old name, kept as an alias

[tool.uv]
# openwakeword pins tflite-runtime on Linux, which has no wheels for py3.12; we use its ONNX backend.
exclude-dependencies = ["tflite-runtime"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justday"]
