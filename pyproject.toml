[project]
name = "justday"
version = "0.2.0"
description = "JustDay — voice front-end that turns Claude Code into a personal desktop agent for KDE Plasma"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
# Ядро: мозг, календарь, счёт. ~250 МБ — столько ставится всегда.
dependencies = [
    "claude-agent-sdk>=0.2.150",
    "numpy>=2.0",
    "icalendar>=6",
    "recurring-ical-events>=3",
]

# Необязательное. Речь и голос — это гигабайты, и они нужны не всем: без микрофона
# ассистенту диктовать нечего, а без наушников незачем говорить вслух. Установщик
# спрашивает, что ставить, и `justday parts add speech` доносит остальное потом.
[project.optional-dependencies]
speech = [           # распознавание речи и имя ассистента — ~550 МБ
    "faster-whisper>=1.2.1",
    "onnxruntime>=1.20",
    "openwakeword>=0.6.0",
]
voice = [            # нейросетевой голос Silero — ~750 МБ (без него говорит espeak-ng)
    "torch>=2.8",
]
shell = [            # окно своей оболочки в терминале — ~10 МБ (без него оболочка работает строкой)
    "textual>=8",
]
cuda = [             # распознавание речи на видеокарте NVIDIA — ~2.2 ГБ
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
justday = "justday.cli:main"

[tool.uv]
# openwakeword pins tflite-runtime on Linux, which has no wheels for py3.12; we use its ONNX backend.
exclude-dependencies = ["tflite-runtime"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/justday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
# The code is written to a wide screen; comments and docstrings are Russian, so ambiguous-unicode is noise.
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E741", "B905", "SIM105", "SIM108"]
