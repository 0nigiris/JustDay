[project]
name = "justday"
version = "0.2.0"
description = "JustDay — voice front-end that turns Claude Code into a personal desktop agent for KDE Plasma"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "claude-agent-sdk>=0.2.150",
    "numpy>=2.0",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "segno>=1.6",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.2.1",
    "onnxruntime>=1.20",
    "openwakeword>=0.6.0",
]
voice = [
    "torch>=2.8",
]
shell = [
    "textual>=8",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
justday = "justday.cli:main"

[tool.uv]
exclude-dependencies = [
    "tflite-runtime",
]
index = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources.torch]
index = "pytorch-cpu"

[tool.hatch.build.targets.wheel.find]
where = [
    "src",
]

[tool.hatch.build.targets.wheel.package-data]
justday = [
    "*.py",
    "brain/*.md",
    "brain/*.json",
    "brain/роли/*",
    "brain/characters/*",
    "island/*.qml",
    "island/*.js",
    "island/icons/*",
    "island/sounds/*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "E741",
    "B905",
    "SIM105",
    "SIM108",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
