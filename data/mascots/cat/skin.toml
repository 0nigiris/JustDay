# Кот. Шар с деталями: уши, усы, тонкий хвост.
#
# Здесь нет ни одной картинки — всё рисует островок по этим числам. Поэтому у кота есть все
# выражения и все живости: дёргать ухом и вилять хвостом умеет движок, а не художник.
name = "Кот"
author = "JustDay"
license = "CC0"

[body]
top = "#ffcf9a"         # верх шара — он светлее, оттуда падает свет
bottom = "#ff9f45"

[ears]
shape = "triangle"
fill = "#ff9f45"
inner = "#ffc9a6"
size = 0.34             # доля от тела
spread = 0.62           # как широко расставлены
tilt = 16               # наклон наружу, градусы

[tail]
shape = "thin"
fill = "#ff9f45"
size = 0.95

[whiskers]
count = 3
fill = "#fff1e2"

[face]
muzzle = "#fff1e2"
nose = "#e2707f"
blush = "#ff9a86"

[eyes]
x = 0.5
y = 0.43
spacing = 0.34
scale = 0.46
ink = "#2b1d14"
