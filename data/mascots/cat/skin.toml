# Кот — скин маскота островка.
#
# Тело нарисовано локальной моделью (Flux Schnell) прямо на этой машине; глаза рисует островок
# поверх него по координатам ниже. Поэтому у кота есть все тринадцать выражений, хотя картинка одна.
name = "Кот"
author = "JustDay"
license = "CC0"
image = "body.png"

[eyes]
at = [0.5, 0.361]
spacing = 0.383
scale = 0.36
ink = "#2b1d14"

[motion]
breathe = 1.0
bob = 1.0
squish = 1.0
tilt = 1.0
