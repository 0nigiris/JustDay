name: windows

# Островок для Windows: тот же QML, хозяин окна на PySide6 (island/host.py), собранный в .exe.
# Своего Windows у нас нет, поэтому сборка проверяет себя сама: собранный .exe открывает пульт
# вне экрана и снимает его — снимок лежит рядом с архивом, по нему видно, что островок жив.
on:
  push:
    branches: [main]
    paths: ["island/**", "src/**", "data/**", "installer/**", "brand/justday.ico", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Зависимости
        # Сам Джарвис (пакет justday) едет внутри того же .exe: другу не ставить ни Python, ни pip.
        run: python -m pip install --disable-pip-version-check ".[speech]" PySide6==6.12.0 pyinstaller
      - name: Кнопки островка делают что-то и на Windows
        # Здесь есть PySide6, которого нет в Linux-окружении тестов: там этот тест пропускается.
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_island_windows_buttons.py
      - name: Сборка
        shell: bash
        run: |
          # qmldir нужен чистому Qt, чтобы найти синглтон JD; в живую папку на Linux его не кладём.
          echo "singleton JD 1.0 JD.qml" > island/qmldir
          rm -rf island/__pycache__ island/kwin-effects
          pyinstaller --noconfirm --windowed --name JustDay --icon brand/justday.ico \
            --add-data "island;island" \
            --add-data "src/justday/brain;justday/brain" --add-data "data;data" --add-data "pyproject.toml;." \
            --collect-submodules justday --collect-submodules keyring --collect-submodules pycaw \
            --collect-all faster_whisper --collect-all openwakeword --collect-all ctranslate2 --collect-all onnxruntime \
            --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtQuickControls2 \
            island/host.py
      - name: Проверка снимком
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          # Вне экрана Qt не видит шрифты Windows сам и рисует квадратики; живому окну это не нужно.
          QT_QPA_FONTDIR: C:\Windows\Fonts
          JUSTDAY_SHOT: ${{ github.workspace }}\shot.png
        run: |
          ./dist/JustDay/JustDay.exe
          test -s shot.png
      - name: Джарвис внутри exe отвечает
        shell: bash
        run: |
          # Тот же .exe — демон и команды. Без этого шага exe мог собраться «одним островком»:
          # кнопки есть, а думать некому, как и было до 18 ноября.
          ./dist/JustDay/JustDay.exe daemon > daemon.log 2>&1 &
          for i in $(seq 30); do sleep 2; ./dist/JustDay/JustDay.exe status > status.txt 2>&1 && break; done
          cat status.txt; tail -30 daemon.log
          grep -q '"ok": true' status.txt
      - name: Окна — видит, сворачивает, выводит вперёд и закрывает
        # «Сверни браузер», «закрой дискорд», док и сцены на Windows идут через winwindows.py (user32).
        # Блокнот есть на любой Windows: если его окна не видно в списке, не работает ничего из этого.
        shell: pwsh
        run: |
          $exe = "./dist/JustDay/JustDay.exe"
          Start-Process notepad; Start-Sleep 3
          $l = & $exe windows list | Out-String; $l
          if ($l -notmatch '"app": "[Nn]otepad"') { throw "окна Блокнота нет в списке" }
          & $exe windows minimize notepad | Out-Null; Start-Sleep 1
          if ((& $exe windows list notepad | ConvertFrom-Json)[0].minimized -ne $true) { throw "не свернулся" }
          & $exe windows focus notepad | Out-Null; Start-Sleep 1
          if ((& $exe windows list notepad | ConvertFrom-Json)[0].minimized -ne $false) { throw "не развернулся" }
          & $exe windows close notepad | Out-Null; Start-Sleep 2
          if (Get-Process notepad -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0) { throw "не закрылся" }
      - name: Spotlight — находит программу и показывает её
        # Alt+Space на Windows ловит host.py (RegisterHotKey); здесь проверяется то, что за ней:
        # поиск по меню «Пуск» через демона и как карточка поиска выглядит на 1024×768.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          JUSTDAY_SHOT: ${{ github.workspace }}\spotlight.png
          JUSTDAY_SHOT_DO: 'JD.openSearch(); JD.menuQuery = "note"; JD.searchMenu()'
        run: |
          ./dist/JustDay/JustDay.exe apps list notepad | tee apps.txt
          grep -qi notepad apps.txt
          ./dist/JustDay/JustDay.exe
          test -s spotlight.png
      - name: Команда justday — для мозга и сцен
        # Персона и навыки зовут `justday …`; в exe её нет, демон кладёт прокладки в state\bin.
        shell: bash
        run: |
          export JUSTDAY_EXE="$(cygpath -w "$PWD/dist/JustDay/JustDay.exe")"
          bin="$(cygpath -u "$LOCALAPPDATA")/JustDay/state/bin"
          "$bin/justday" status | grep -q '"ok": true'
          cmd //c "$(cygpath -w "$bin/justday.cmd")" status | grep -q '"ok": true'
      - name: Слух — своя речь внутри exe
        # Имя и «Hey Jarvis» слушаются только своей речью: облаку не отдаём всё, что звучит в комнате.
        # Если сборка потеряла Whisper, Джарвис тихо вернулся бы к кнопке и к ключу Groq.
        shell: bash
        timeout-minutes: 15  # зависший слух держал всю сборку шесть часов, до предела GitHub
        run: ./dist/JustDay/JustDay.exe test stt
      - name: Филин — встаёт на стражу и снимается
        # Срабатывание здесь не проверить: нажатия робота помечены injected, и Филин их нарочно
        # пропускает. Проверяется то, что ломается тихо: процесс поднялся, хуки встали, «off» его снял.
        shell: pwsh
        run: |
          $exe = "./dist/JustDay/JustDay.exe"
          $on = & $exe filin on | ConvertFrom-Json; $on
          if (-not $on.available) { throw "Филина нет в сборке" }
          Start-Sleep 5
          if (-not (& $exe filin status | ConvertFrom-Json).on) { throw "Филин упал сразу после запуска" }
          & $exe filin off | Out-Null; Start-Sleep 2
          if ((& $exe filin status | ConvertFrom-Json).on) { throw "Филин не снялся" }
      - name: Док — значки программ, окна и панель задач
        # На Linux этого не проверить: значки рисует сам Проводник, панель задач — его же окно.
        # Пустой значок — серая клякса в доке вместо программы; панель, не вернувшаяся после
        # выключения настройки, — человек без панели задач вовсе.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import ctypes, sys
          sys.path.insert(0, "island")
          from PySide6.QtGui import QGuiApplication
          app = QGuiApplication([])
          import host
          for t in (r"C:\Windows\explorer.exe", r"shell:AppsFolder\Microsoft.Windows.Explorer"):
              img = host._win_icon(t, 64)
              assert img is not None and not img.isNull(), t
              assert any(img.pixelColor(x, y).alpha() for x in range(0, img.width(), 4) for y in range(0, img.height(), 4)), t
          from justday import desktop, dock
          apps = desktop._scan_windows_apps()
          assert any(a["wmclass"] for a in apps), "ни у одной программы из «Пуска» не нашёлся exe"
          print("док по умолчанию:", dock._seed())
          u = ctypes.windll.user32
          h = u.FindWindowW("Shell_TrayWnd", None)
          if h:  # у робота без рабочего стола панели может не быть
              host._taskbar(True)
              assert not u.IsWindowVisible(h), "панель задач не спряталась"
              host._taskbar(False)
              assert u.IsWindowVisible(h), "панель задач не вернулась"
          PY
      - name: Установщик
        # Другу нужна установка, а не папка: ярлык в «Пуске», удаление из «Параметров», автозапуск по желанию.
        shell: bash
        run: |
          choco install innosetup -y --no-progress > /dev/null
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DAppVersion=$ver" installer/justday.iss
          ls -la dist/*.exe
      - name: Установка глазами — капсула вместо мастера, ни одного окна консоли
        # Обычный запуск, как у друга: снимок экрана через несколько секунд должен показать чёрную
        # капсулу сверху, а не серое окно «Далее → Далее». Всё время установки и холодного пуска
        # раз в четверть секунды смотрим, не появилось ли окно консоли: демон в exe отсоединён, и
        # каждый его powershell/ffmpeg без CREATE_NO_WINDOW открывал своё (27 нояб.). Мелькнувшее
        # окно живёт доли секунды, поэтому опрос, а не один снимок.
        shell: pwsh
        run: |
          # Окно агента GitHub с логами лежало поверх стола на каждом снимке — свернуть всё заранее.
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 1
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          function Shot($name) {
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name")
          }
          $console = 'conhost','OpenConsole','WindowsTerminal','cmd','powershell','pwsh','python','ffmpeg','where','reg','schtasks'
          $before = @(Get-Process | Where-Object MainWindowHandle -ne 0 | ForEach-Object Id)
          $seen = @{}
          function Watch($ms) {
            $until = (Get-Date).AddMilliseconds($ms)
            while ((Get-Date) -lt $until) {
              Get-Process -ErrorAction SilentlyContinue | Where-Object {
                $_.MainWindowHandle -ne 0 -and $before -notcontains $_.Id -and $console -contains $_.ProcessName
              } | ForEach-Object { $seen["$($_.ProcessName) #$($_.Id) «$($_.MainWindowTitle)»"] = 1 }
              Start-Sleep -Milliseconds 250
            }
          }
          $setup = Get-ChildItem dist\JustDay-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -PassThru
          Watch 4000
          Shot setup-shot.png
          $t = 0
          while (-not $p.HasExited -and $t -lt 120) { Watch 1000; $t++ }
          $done = $p.HasExited
          Watch 30000  # холодный пуск exe: демон, островок, шарик и знакомство
          Shot after-setup-shot.png
          # Кнопки островка зовут те же команды, а они — powershell, reg, where: каждая могла бы мигнуть
          # своим окном уже после знакомства, когда человек жмёт кнопки.
          $exe = "$env:LOCALAPPDATA\Programs\JustDay\JustDay.exe"
          foreach ($c in 'status', 'doctor', 'apps', 'windows', 'version') { Start-Process $exe $c -WindowStyle Hidden }
          Watch 20000
          taskkill /F /IM JustDay.exe 2>$null
          # Установка, которая ждёт щелчка, у друга выглядела бы зависшей.
          if (-not $done) { $p.Kill(); Write-Error "установщик не закончил за 2 минуты: ждёт щелчка?"; exit 1 }
          if ($seen.Count) { Write-Error ("выскочили окна консоли: " + ($seen.Keys -join '; ')); exit 1 }
          exit 0
      - name: Установка, запуск и удаление
        # Проверяем то, что получит друг: тихая установка, Джарвис из установленной папки отвечает,
        # удаление убирает программу.
        shell: bash
        run: |
          taskkill //F //IM JustDay.exe || true  # демон из прошлого шага держит порт: отвечал бы он, а не установленный
          sleep 2
          ./dist/JustDay-Setup-*.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          app="$LOCALAPPDATA/Programs/JustDay"
          test -f "$app/JustDay.exe"
          ls "$APPDATA/Microsoft/Windows/Start Menu/Programs/JustDay"
          "$app/JustDay.exe" daemon > installed.log 2>&1 &
          for i in $(seq 30); do sleep 2; "$app/JustDay.exe" status > st.txt 2>&1 && break; done
          grep -q '"ok": true' st.txt
          # Автозапуск включается из знакомства в островке; удаление обязано его убрать.
          "$app/JustDay.exe" autostart on | grep -q true
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' //v JustDay
          "$app/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES
          for i in $(seq 15); do sleep 2; test -f "$app/JustDay.exe" || break; done
          ! test -f "$app/JustDay.exe"
          ! reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' //v JustDay
      - uses: actions/upload-artifact@v4
        with:
          name: JustDay-Setup
          path: dist/JustDay-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JustDay-windows
          path: dist/JustDay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot
          path: |
            shot.png
            spotlight.png
            setup-shot.png
            after-setup-shot.png
