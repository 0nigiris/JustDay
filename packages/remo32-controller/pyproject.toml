[project]
name = "remo32-controller"
version = "0.1.0"
description = "Центральный контроллер Remo32: REST API + мобильный веб-интерфейс"
requires-python = ">=3.12"
dependencies = [
    "remo32-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "webauthn>=2.2",
    "aiomqtt>=2.3",
    "python-multipart>=0.0.17",
]

[project.scripts]
remo32-controller = "remo32_controller.__main__:main"

[tool.uv.sources]
remo32-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remo32_controller"]
