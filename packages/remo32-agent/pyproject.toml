[project]
name = "remo32-agent"
version = "0.1.0"
description = "Агент Remo32, работающий на управляемом ПК"
requires-python = ">=3.12"
dependencies = [
    "remo32-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psutil>=6.1",
]

[project.scripts]
remo32-agent = "remo32_agent.__main__:main"

[tool.uv.sources]
remo32-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remo32_agent"]
