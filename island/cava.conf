; Столбики плеера (EqBars.qml): четыре полосы, 30 кадров, числа 0–13 через «;».
; Источник не задан — cava сам берёт монитор системного вывода (pipewire/pulse).
[general]
bars = 4
framerate = 30

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 13
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
