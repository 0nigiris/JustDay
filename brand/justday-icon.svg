<?xml version="1.0" encoding="UTF-8"?>
<!-- JustDay. Геометрия и цвета — docs/логотип.json. Надпись переведена в кривые:
     знак не должен зависеть от того, установлен ли Inter на чужой машине. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="JustDay">
  <title>JustDay</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161A"/><stop offset="1" stop-color="#0A0A0D"/>
    </linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26.982" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-50%" y="-120%" width="200%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="42.325" flood-color="#0A84FF" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="229.069" fill="url(#bg)"/>
  <g transform="translate(194.56 379.733) scale(2.204)">
    <rect x="0" y="0" width="288" height="120" rx="60" fill="#0A0A0D" filter="url(#halo)"/>
    <circle cx="92.16" cy="60" r="20.4" fill="#0A84FF" filter="url(#g)"/>
    <rect x="163.296" y="53.064" width="65.28" height="13.872" rx="6.936" fill="#64D2FF" opacity="0.7"/>
  </g>
</svg>
