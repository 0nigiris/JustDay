# Локальный MQTT-брокер для разработки и как альтернатива облачному.
#
# Запуск:
#   podman run -d --rm --name remo32-mqtt -p 1883:1883 \
#     -v "$PWD/deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:Z" \
#     docker.io/library/eclipse-mosquitto:2
#
# ВНИМАНИЕ: анонимный доступ включён — это конфигурация ДЛЯ РАЗРАБОТКИ.
# Для постоянной работы обязательно включите пароли и TLS (см. ниже).

listener 1883 0.0.0.0
allow_anonymous true

# --- Для боевого использования раскомментируйте и настройте ------------
#
# allow_anonymous false
# password_file /mosquitto/config/passwd
#     Создать: mosquitto_passwd -c /mosquitto/config/passwd remo32
#
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
#
# Ограничить каждому клиенту свою ветку топиков:
# acl_file /mosquitto/config/acl
